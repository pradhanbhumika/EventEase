{% extends "base.html" %}

{% block title %}Login – EventEase{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card">
        <h1>Welcome back 👋</h1>
        <p class="sub">Log in to book tickets and manage your bookings.</p>

        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-control"
                       value="{{ email }}" placeholder="you@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show or hide password">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <p class="auth-switch">
            New to EventEase?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
        <p class="auth-switch">
            <a href="{{ url_for('admin_login') }}">Admin login →</a>
        </p>
    </div>
</section>
{% endblock %}
