{% extends "base.html" %}

{% block title %}Admin Login – EventEase{% endblock %}

{% block content %}
<section class="auth-wrapper admin">
    <div class="auth-card">
        <h1>🔐 Admin Login</h1>
        <p class="sub">Sign in to manage events, bookings and revenue.</p>

        <div class="demo-note">
            Demo admin: <strong>admin@eventease.com</strong> / <strong>admin123</strong>
        </div>

        <form method="post" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="email">Admin email</label>
                <input type="email" id="email" name="email" class="form-control"
                       value="{{ email }}" placeholder="admin@eventease.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter admin password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show or hide password">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Login as Admin</button>
        </form>

        <p class="auth-switch"><a href="{{ url_for('index') }}">← Back to website</a></p>
    </div>
</section>
{% endblock %}
